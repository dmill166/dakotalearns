name: Deploy site

on:
  push:
    branches: [main]
  # Course repos fire this when their content changes (the site pulls their
  # prose at build time). See each course repo's rebuild-site workflow.
  repository_dispatch:
    types: [course-content]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install MkDocs Material + plugins
        # Pinned in requirements.txt (single source; the README installs from it too).
        run: pip install -r requirements.txt
      - name: Sync course content from source repos
        # Single source of truth = each course's public repo (see courses.yml).
        # Pulls prose into docs/ just before the build; nothing is committed here.
        run: python tools/sync_courses.py
      - name: Content gate (publish-lock + a11y)
        # Runs AFTER sync so it sees synced course pages too, and BEFORE build
        # so a failure blocks publishing. Hard-fails on any surviving
        # author_status: dakota-voice-draft and on missing mermaid accDescr /
        # <img> alt. See tools/check_content.py + cs-teaching/a11y.md.
        run: python tools/check_content.py
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
